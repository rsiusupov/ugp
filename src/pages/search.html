<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поиск — Underground &amp; Pound</title>
  </head>
  <body>
    <div class="S_Page S_Page-search" data-site-search>
      <nav class="O_Nav O_Nav-search" aria-label="Поиск по сайту">
        <a class="A_Logo" href="../index.html" aria-label="Underground and Pound">
          <img
            src="../images/logos/logo-mark.svg"
            width="32"
            height="32"
            alt=""
          />
        </a>
        <form class="O_Nav__SearchForm" role="search" action="search.html" method="get" data-search-form>
          <label class="O_Nav__SearchField">
            <span class="visually-hidden">Поиск по сайту</span>
            <input
              class="A_Input A_Input-medium"
              type="search"
              name="q"
              placeholder="Поиск"
              autocomplete="off"
              data-search-input
            />
          </label>
          <button class="M_Button M_Button-m" type="submit">
            <span class="A_TextLabel">Поиск</span>
          </button>
        </form>
        <a
          class="A_IconButton O_Nav__Close"
          href="../index.html"
          data-search-close
          aria-label="Закрыть поиск"
        >
          <img
            class="A_Icon"
            src="../images/icons/x.svg"
            width="20"
            height="20"
            alt=""
          />
        </a>
      </nav>

      <main class="S_Search">
        <section class="S_Search__Group" data-search-group="articles">
          <header class="M_ArticlesHeader">
            <h1 class="A_TextH2">Статьи</h1>
            <a class="A_IconButton" href="articles.html" aria-label="Все статьи">
              <img
                class="A_Icon"
                src="../images/icons/arrow-up-right.svg"
                width="20"
                height="20"
                alt=""
              />
            </a>
          </header>
          <div class="S_Search__Rail" data-search-results></div>
          <p class="S_Search__Empty A_TextLead A_Text-darkGray" data-search-empty>
            Ничего не найдено
          </p>
        </section>

        <section class="S_Search__Group" data-search-group="cases">
          <header class="M_ArticlesHeader">
            <h2 class="A_TextH2">Кейсы</h2>
            <a class="A_IconButton" href="cases.html" aria-label="Все кейсы">
              <img
                class="A_Icon"
                src="../images/icons/arrow-up-right.svg"
                width="20"
                height="20"
                alt=""
              />
            </a>
          </header>
          <div class="S_Search__Rail" data-search-results></div>
          <p class="S_Search__Empty A_TextLead A_Text-darkGray" data-search-empty>
            Ничего не найдено
          </p>
        </section>

        <section class="S_Search__Group" data-search-group="tests">
          <header class="M_ArticlesHeader">
            <h2 class="A_TextH2">Тесты</h2>
            <a class="A_IconButton" href="tests.html" aria-label="Все тесты">
              <img
                class="A_Icon"
                src="../images/icons/arrow-up-right.svg"
                width="20"
                height="20"
                alt=""
              />
            </a>
          </header>
          <div class="S_Search__Rail" data-search-results></div>
          <p class="S_Search__Empty A_TextLead A_Text-darkGray" data-search-empty>
            Ничего не найдено
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
