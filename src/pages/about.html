<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>О проекте — Underground & Pound</title>
  </head>
  <body>
    <div class="S_Page">
      <nav class="O_Nav O_Nav-overlay" aria-label="Основная навигация">
        <a class="A_Logo" href="../index.html" aria-label="Underground and Pound">
          <img
            src="../images/logos/logo-mark.svg"
            width="32"
            height="32"
            alt=""
          />
        </a>
        <a
          class="O_Nav__Wordmark"
          href="../index.html"
          aria-hidden="true"
          tabindex="-1"
        >
          <img
            src="../images/logos/logo-wordmark.svg"
            width="2305"
            height="710"
            alt=""
          />
        </a>
        <div class="O_Nav__Actions">
          <div class="M_NavTabs" id="site-menu">
            <a class="M_Button M_Button-quiet" href="../index.html">
              <span class="A_TextLabel">Главная</span>
            </a>
            <a class="M_Button M_Button-quiet" href="articles.html">
              <span class="A_TextLabel">Статьи</span>
            </a>
            <a class="M_Button M_Button-quiet" href="cases.html">
              <span class="A_TextLabel">Разборы</span>
            </a>
            <a class="M_Button M_Button-quiet" href="dictionary.html">
              <span class="A_TextLabel">Ресурсы</span>
            </a>
            <a class="M_Button" href="about.html" aria-current="page">
              <span class="A_TextLabel">О проекте</span>
            </a>
          </div>
          <a
            class="A_IconButton O_Nav__Search"
            href="../index.html"
            aria-label="Поиск"
          >
            <img
              class="A_Icon"
              src="../images/icons/magnifying-glass-nav.svg"
              width="20"
              height="20"
              alt=""
            />
          </a>
        </div>
        <button
          class="A_IconButton O_Nav__Toggle"
          type="button"
          data-nav-toggle
          aria-expanded="false"
          aria-controls="site-menu"
          aria-label="Открыть меню"
        >
          <img
            class="A_Icon O_Nav__Icon-menu"
            src="../images/icons/list.svg"
            width="20"
            height="20"
            alt=""
          />
          <img
            class="A_Icon O_Nav__Icon-close"
            src="../images/icons/x.svg"
            width="20"
            height="20"
            alt=""
          />
        </button>
      </nav>

      <main class="S_AboutPage" data-about-scene>
        <h1 class="visually-hidden">О проекте</h1>
        <div class="S_AboutPage__Stage">
          <div class="S_AboutPage__Viewport">
            <div class="S_AboutPage__Board">
              <div class="S_AboutPage__Ellipse">
                <img
                  src="../images/illustrations/about-ellipse.svg"
                  width="1400"
                  height="860"
                  alt=""
                />
              </div>
              <div class="S_AboutPage__Dove">
                <img
                  src="../images/illustrations/about-dove.svg"
                  width="554"
                  height="579.767"
                  alt=""
                />
              </div>
              <div class="S_AboutPage__Logo">
                <img
                  src="../images/logos/logo-about.svg"
                  width="424"
                  height="131"
                  alt="Underground & Pound"
                />
              </div>
              <p
                class="S_AboutPage__Word S_AboutPage__Word-freedom"
                data-about-word
              >
                Свобода
              </p>
              <p
                class="S_AboutPage__Word S_AboutPage__Word-openness"
                data-about-word
              >
                Открытость
              </p>
              <p
                class="S_AboutPage__Word S_AboutPage__Word-provocation"
                data-about-word
              >
                Провокация
              </p>
              <p
                class="S_AboutPage__Word S_AboutPage__Word-experiment"
                data-about-word
              >
                Эксперимент
              </p>
              <p
                class="S_AboutPage__Word S_AboutPage__Word-independence"
                data-about-word
              >
                Независимость
              </p>
              <p
                class="S_AboutPage__Word S_AboutPage__Word-curiosity"
                data-about-word
              >
                Любопытство
              </p>
              <p
                class="S_AboutPage__Word S_AboutPage__Word-irony"
                data-about-word
              >
                Ирония
              </p>
              <p
                class="S_AboutPage__Word S_AboutPage__Word-courage"
                data-about-word
              >
                Смелость
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
